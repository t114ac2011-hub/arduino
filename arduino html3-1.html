<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>應援加油棒 APP 控制台 - Light Stick Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .glow-effect {
      box-shadow: 0 0 35px var(--glow-color, rgba(168, 85, 247, 0.4));
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-purple-950">

  <div class="glass-card w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl relative overflow-hidden">
    <!-- Top Decorative Gradient Header -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Title & Connection Status -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/20">
        <span>✨ OFFICIAL STAGE CONTROL</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-purple-200 to-pink-300 bg-clip-text text-transparent">
        應援加油棒 App
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">一鍵控制 RGB 光效與 3 段頻率爆閃</p>
    </div>

    <!-- Web Serial Connect Button -->
    <div class="space-y-2">
      <button id="connectBtn" class="w-full py-3.5 px-4 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg shadow-emerald-950/40 transition-all transform active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span id="connectBtnText">連接 Arduino (COM Port)</span>
      </button>
      <div id="statusBadge" class="text-center text-xs text-slate-500 font-medium">狀態：尚未連線</div>
    </div>

    <!-- Live Color Indicator Preview -->
    <div class="flex flex-col items-center justify-center pt-2 pb-4 space-y-4">
      <div id="lightGlow" class="relative w-32 h-32 sm:w-36 sm:h-36 rounded-full flex items-center justify-center transition-all duration-300 glow-effect border-4 border-slate-700/50 bg-slate-900" style="--glow-color: rgba(236, 72, 153, 0.5);">
        <input type="color" id="colorPicker" value="#ec4899" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full cursor-pointer bg-transparent border-0 outline-none">
        <span class="absolute bottom-2 text-[10px] font-bold text-white/80 pointer-events-none drop-shadow">點擊選色</span>
      </div>
      <div class="text-xs font-mono text-slate-400 tracking-wider" id="hexText">#EC4899</div>
    </div>

    <!-- Color Control Actions -->
    <div class="grid grid-cols-2 gap-3">
      <button id="randomBtn" class="py-3 px-4 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/20 transition-all transform active:scale-95">
        <span>🎲 隨機切換色彩</span>
      </button>
      <button id="offBtn" class="py-3 px-4 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-rose-300 border border-rose-500/20 transition-all transform active:scale-95">
        <span>🌙 關閉燈光</span>
      </button>
    </div>

    <!-- 3-Stage Blink Controls -->
    <div class="space-y-3 pt-2 border-t border-slate-800">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          應援閃爍模式 (3段切換)
        </span>
      </div>
      <div class="grid grid-cols-3 gap-2 sm:gap-3">
        <button id="blink1Btn" class="py-3 px-2 rounded-xl font-bold text-xs bg-slate-800 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 transition-all transform active:scale-95 flex flex-col items-center gap-1">
          <span>慢速閃爍</span>
          <span class="text-[10px] opacity-75 font-normal">1 Hz</span>
        </button>
        <button id="blink2Btn" class="py-3 px-2 rounded-xl font-bold text-xs bg-slate-800 hover:bg-orange-500/20 text-orange-300 border border-orange-500/30 transition-all transform active:scale-95 flex flex-col items-center gap-1">
          <span>中速閃爍</span>
          <span class="text-[10px] opacity-75 font-normal">2.5 Hz</span>
        </button>
        <button id="blink3Btn" class="py-3 px-2 rounded-xl font-bold text-xs bg-slate-800 hover:bg-red-500/20 text-red-300 border border-red-500/30 transition-all transform active:scale-95 flex flex-col items-center gap-1">
          <span>極速爆閃</span>
          <span class="text-[10px] opacity-75 font-normal">5 Hz</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let port, writer;

    const connectBtn = document.getElementById('connectBtn');
    const connectBtnText = document.getElementById('connectBtnText');
    const statusBadge = document.getElementById('statusBadge');
    const colorPicker = document.getElementById('colorPicker');
    const lightGlow = document.getElementById('lightGlow');
    const hexText = document.getElementById('hexText');

    const randomBtn = document.getElementById('randomBtn');
    const offBtn = document.getElementById('offBtn');
    const blink1Btn = document.getElementById('blink1Btn');
    const blink2Btn = document.getElementById('blink2Btn');
    const blink3Btn = document.getElementById('blink3Btn');

    // Connect Serial Port
    connectBtn.addEventListener('click', async () => {
      if (!("serial" in navigator)) {
        alert("您的瀏覽器不支援 Web Serial API，請使用 Google Chrome 或 Microsoft Edge！");
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();

        statusBadge.textContent = "狀態：已連線至 Arduino";
        statusBadge.className = "text-center text-xs text-emerald-400 font-semibold";
        connectBtnText.textContent = "Arduino 已連線";
        connectBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 bg-emerald-600 text-white cursor-default shadow-lg shadow-emerald-950/40";
      } catch (err) {
        statusBadge.textContent = "連線失敗: " + err.message;
        statusBadge.className = "text-center text-xs text-rose-400 font-medium";
      }
    });

    // Send serial command function
    async function sendCommand(cmd) {
      if (!writer) {
        alert("請先點擊『連接 Arduino』按鈕！");
        return;
      }
      const encoder = new TextEncoder();
      await writer.write(encoder.encode(cmd + '\n'));
    }

    // Update color glow preview UI
    function updateColorUI(hex) {
      colorPicker.value = hex;
      hexText.textContent = hex.toUpperCase();
      lightGlow.style.setProperty('--glow-color', hex + '80');
    }

    // Color Picker Input Event
    colorPicker.addEventListener('input', (e) => {
      const hex = e.target.value;
      updateColorUI(hex);
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      sendCommand(`${r},${g},${b}`);
    });

    // Random Color Event
    randomBtn.addEventListener('click', () => {
      const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      updateColorUI(randomHex);
      sendCommand("RANDOM");
    });

    // Turn Off Light Event
    offBtn.addEventListener('click', () => {
      updateColorUI('#000000');
      sendCommand("0,0,0");
    });

    // 3-Stage Blink Events
    blink1Btn.addEventListener('click', () => sendCommand("BLINK1"));
    blink2Btn.addEventListener('click', () => sendCommand("BLINK2"));
    blink3Btn.addEventListener('click', () => sendCommand("BLINK3"));
  </script>
</body>
</html>
